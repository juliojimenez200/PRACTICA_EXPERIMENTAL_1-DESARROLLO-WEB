<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="form-header">
      <h1>Crear cuenta</h1>
      <p>Completa tus datos para registrarte en la plataforma</p>
    </header>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <form id="registroForm" novalidate>

      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <div class="input-wrapper">
          <input type="text" id="nombre" name="nombre" class="has-icon" placeholder="Ej: Juan Pérez" required minlength="3">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
          <svg class="valid-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="error-message" id="error-nombre"></span>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <div class="input-wrapper">
          <input type="email" id="correo" name="correo" class="has-icon" placeholder="ejemplo@correo.com" required>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <svg class="valid-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="error-message" id="error-correo"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" class="has-icon has-toggle" placeholder="Mínimo 8 caracteres" required minlength="8">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-meter"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-text" id="strengthText"></span>
          <span class="error-message" id="error-password"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" class="has-icon has-toggle" placeholder="Repite tu contraseña" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="error-message" id="error-confirmPassword"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="edad">Edad</label>
          <div class="input-wrapper">
            <input type="number" id="edad" name="edad" class="has-icon" placeholder="18" min="18" max="99" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
            <svg class="valid-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="error-message" id="error-edad"></span>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <div class="input-wrapper">
            <input type="tel" id="telefono" name="telefono" class="has-icon" placeholder="0999999999" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
            <svg class="valid-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="error-message" id="error-telefono"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="pais">País</label>
        <div class="input-wrapper">
          <select id="pais" name="pais" class="has-icon" required>
            <option value="">Selecciona un país</option>
            <option value="EC">Ecuador</option>
            <option value="CO">Colombia</option>
            <option value="PE">Perú</option>
            <option value="MX">México</option>
            <option value="AR">Argentina</option>
            <option value="OT">Otro</option>
          </select>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg>
        </div>
        <span class="error-message" id="error-pais"></span>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="terminos" name="terminos" required>
          <span class="checkbox-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span>Acepto los términos y condiciones</span>
        </label>
        <span class="error-message" id="error-terminos"></span>
      </div>

      <button type="submit" id="submitBtn">
        <span class="btn-label">Registrarse</span>
      </button>

      <div id="formMessage" class="form-message" role="status"></div>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
