<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="card">
  <div class="form-header">
    <div class="logo">✦</div>
    <h1>Crea tu cuenta</h1>
    <p>Completa tus datos para registrarte</p>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <form id="registroForm" novalidate>
    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <div class="input-wrapper"><input type="text" id="nombre" placeholder="Juan Pérez" autocomplete="name"><span class="valid-check">✔</span></div>
      <span class="error-message" id="error-nombre"></span>
    </div>
    <div class="form-group">
      <label for="correo">Correo electrónico</label>
      <div class="input-wrapper"><input type="email" id="correo" placeholder="correo@ejemplo.com" autocomplete="email"><span class="valid-check">✔</span></div>
      <span class="error-message" id="error-correo"></span>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="password" class="has-toggle" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña">👁</button>
      </div>
      <div class="strength-meter"><div class="strength-fill" id="strengthFill"></div></div>
      <span class="strength-text" id="strengthText"></span>
      <span class="error-message" id="error-password"></span>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirmar contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="confirmPassword" class="has-toggle" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña">👁</button>
      </div>
      <span class="error-message" id="error-confirmPassword"></span>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <div class="input-wrapper"><input type="date" id="fechaNacimiento"></div>
        <span class="error-message" id="error-fechaNacimiento"></span>
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <div class="input-wrapper"><input type="tel" id="telefono" placeholder="0991234567" maxlength="10" autocomplete="tel"><span class="valid-check">✔</span></div>
        <span class="error-message" id="error-telefono"></span>
      </div>
    </div>
    <div class="form-group">
      <label for="pais">País</label>
      <div class="input-wrapper">
        <select id="pais">
          <option value="">Selecciona un país</option>
          <option>Ecuador</option><option>Colombia</option><option>Perú</option>
          <option>México</option><option>Argentina</option><option>Otro</option>
        </select>
      </div>
      <span class="error-message" id="error-pais"></span>
    </div>
    <div class="form-group checkbox-group">
      <label class="checkbox-wrapper" for="terminos">
        <input type="checkbox" id="terminos">
        <span class="checkbox-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
        Acepto los términos y condiciones
      </label>
      <span class="error-message" id="error-terminos"></span>
    </div>
    <button type="submit" id="submitBtn">Registrarse</button>
    <div class="form-message" id="formMessage"></div>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
